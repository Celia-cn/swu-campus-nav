spring.application.name=gps
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

server.port=8091
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/swu_gis?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Shanghai

app.auth.session-days=7
# 媒体根目录 uploads_media/picture/{loc_id}/ 与 uploads_media/listen/{loc_id}/（可用 application-local.properties 覆盖为绝对路径）
app.media.upload-dir=uploads_media
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# DeepSeek（请在 application-local.properties 中配置 app.deepseek.api-key，勿提交密钥）
app.deepseek.base-url=https://api.deepseek.com
app.deepseek.api-key=
# deepseek-chat=快速对话；deepseek-reasoner=深度推理（更智慧，响应稍慢）
app.deepseek.model=deepseek-reasoner
app.deepseek.max-tokens=4096
app.deepseek.temperature=0.6
app.deepseek.connect-timeout-sec=15
app.deepseek.read-timeout-sec=120
app.ai.rag-top-k=8
app.ai.max-history=16